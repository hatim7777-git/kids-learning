<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Learning for Kids!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .home-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .category-section {
            margin-bottom: 40px;
        }
        .category-title {
            font-size: 2rem;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .nav-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            justify-content: center;
        }
        .nav-card {
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 6px 0 #ddd, 0 10px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s ease;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
        }
        .nav-card:hover {
            transform: scale(1.05);
        }
        .nav-card:active {
            transform: scale(0.95);
        }
        .nav-card-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .nav-card-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            text-align: center;
        }
        .nav-card-english {
            background-color: #FF5722;
        }
        .nav-card-numbers {
            background-color: #4CAF50;
        }
        .nav-card-games {
            background-color: #00BCD4;
        }
        .nav-card-arabic {
            background-color: #28a745;
        }
        .nav-card-shapes {
            background-color: #3F51B5;
        }
        .nav-card-colors {
            background-color: #E91E63;
        }
        .nav-card-writing {
            background-color: #009688;
        }
        .nav-card-title {
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>🎉 Let's Learn! 🎉</h1>
    </header>

    <div class="home-container">
        <!-- English Learning -->
        <div class="category-section">
            <h2 class="category-title">🔤 English Learning</h2>
            <div class="nav-cards">
                <a href="abc.html" class="nav-card nav-card-english">
                    <div class="nav-card-icon">🔤</div>
                    <div class="nav-card-title">ABCs</div>
                </a>
                <a href="numbers.html" class="nav-card nav-card-numbers">
                    <div class="nav-card-icon">🔢</div>
                    <div class="nav-card-title">123s</div>
                </a>
            </div>
        </div>

        <!-- Games -->
        <div class="category-section">
            <h2 class="category-title">🎮 Quiz Games</h2>
            <div class="nav-cards">
                <a href="alphabet-quiz.html" class="nav-card nav-card-games">
                    <div class="nav-card-icon">🔤</div>
                    <div class="nav-card-title">Alphabet Quiz</div>
                </a>
                <a href="number-quiz.html" class="nav-card nav-card-games">
                    <div class="nav-card-icon">🔢</div>
                    <div class="nav-card-title">Number Quiz</div>
                </a>
                <a href="color-quiz.html" class="nav-card nav-card-games">
                    <div class="nav-card-icon">🌈</div>
                    <div class="nav-card-title">Color Quiz</div>
                </a>
            </div>
        </div>

        <!-- Arabic Learning -->
        <div class="category-section">
            <h2 class="category-title">🔠 Arabic Learning</h2>
            <div class="nav-cards">
                <a href="arabic-abc.html" class="nav-card nav-card-arabic">
                    <div class="nav-card-icon">🔠</div>
                    <div class="nav-card-title">Arabic ABCs</div>
                </a>
                <a href="arabic-numbers.html" class="nav-card nav-card-arabic">
                    <div class="nav-card-icon">١٢٣</div>

        </div>

        <!-- Shapes & Colors -->
        <div class="category-section">
            <h2 class="category-title">🎨 Shapes & Colors</h2>
            <div class="nav-cards">
                <a href="shapes.html" class="nav-card nav-card-shapes">
                    <div class="nav-card-icon">🎨</div>
                    <div class="nav-card-title">Shapes</div>
                </a>
                <a href="colors.html" class="nav-card nav-card-colors">
                    <div class="nav-card-icon">🌈</div>
                    <div class="nav-card-title">Colors</div>
                </a>
            </div>
        </div>

        <!-- Writing Tests -->

            <div class="nav-cards">
                <a href="writing-test.html" class="nav-card nav-card-writing">

                    <div class="nav-card-title">English Writing</div>
                </a>
                <a href="arabic-writing-test.html" class="nav-card nav-card-writing">
                    <div class="nav-card-icon">✍️</div>
                    <div class="nav-card-title">Arabic Writing</div>
                </a>
            </div>
        </div>
    </div>

    <footer style="text-align: center; padding: 20px; margin-top: 40px;">
        <a href="index.html" style="color: #333; text-decoration: none; font-size: 1.2rem;">🏠 Back to Home</a>
    </footer>

</html>
