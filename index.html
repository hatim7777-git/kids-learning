<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Learning for Kids!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/arabic-style.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

    <header>
        <h1>🎉 Let's Learn! 🎉</h1>
    </header>

    <div class="nav-buttons">
        <button id="abc-mode-btn" class="mode-btn" onclick="switchMode('abc')">🔤 ABCs</button>
        <button id="num-mode-btn" class="mode-btn" onclick="switchMode('num')">🔢 123s</button>
        <button id="game-abc-btn" class="mode-btn" onclick="switchMode('game-abc')">Alphabet Quiz 🔤</button>
        <button id="game-num-btn" class="mode-btn" onclick="switchMode('game-num')">Number Quiz 🔢</button>
        <button id="game-colors-btn" class="mode-btn" onclick="switchMode('game-colors')">Color Quiz 🌈</button>
        <button id="arabic-abc-btn" class="mode-btn" onclick="switchMode('arabic-abc')">🔠 Arabic</button>
        <button id="arabic-num-btn" class="mode-btn" onclick="switchMode('arabic-num')">١٢٣ Arabic</button>
        <button id="shapes-btn" class="mode-btn" onclick="switchMode('shapes')">🎨 Shapes</button>
        <button id="colors-btn" class="mode-btn" onclick="switchMode('colors')">🌈 Colors</button>
        <button id="writing-test-btn" class="mode-btn" onclick="switchMode('writing-test')">✍️ Writing Test</button>
        <button id="arabic-writing-test-btn" class="mode-btn" onclick="switchMode('arabic-writing-test')">✍️ Arabic Writing</button>
        <button id="play-abc-song-btn" class="mode-btn song-btn hidden" onclick="toggleSong('abc')">Play ABC Song 🎵</button>
        <button id="play-num-song-btn" class="mode-btn song-btn hidden" onclick="toggleSong('num')">Play 123 Song 🎵</button>
    </div>

    <!-- Active Detail Panel -->
    <div id="details-display" class="hidden container-fluid">
        <img id="primary-image" src="" alt="Detail view">
        <div class="example-display">
            <p id="number-word-text" class="m-0"></p>
            <img id="example-image" src="" alt="Example visualization">
            <p id="example-text" class="m-0"></p>
        </div>
    </div>

    <!-- Game Panel -->
    <div id="game-container" class="hidden container-fluid">
        <div id="score-area">
            Score: <span id="stars-display"></span>
        </div>
        <div id="feedback-text"></div>
        <h2 id="question-text"></h2>
        <div id="options-area"></div>
    </div>

    <main id="learning-main" class="container-fluid mb-4">
        <div id="abc-container"></div>
        <div id="num-container" class="hidden"></div>
        <div id="arabic-abc-container" class="hidden"></div>
        <div id="arabic-num-container" class="hidden"></div>
        <div id="shapes-container" class="hidden"></div>
        <div id="colors-container" class="hidden"></div>
    </main>

    <!-- Writing Test Panel -->
    <div id="writing-test-panel" class="hidden container-fluid">
        <div class="writing-test-header">
            <h2 id="writing-instruction">Write the letter: A</h2>
            <div class="writing-controls">
                <button id="prev-writing-btn" class="writing-btn">⬅️ Previous</button>
                <button id="toggle-guide-btn" class="writing-btn">👁️ Guide</button>
                <button id="clear-canvas-btn" class="writing-btn">🗑️ Clear</button>
                <button id="check-writing-btn" class="writing-btn">✅ Check</button>
                <button id="next-writing-btn" class="writing-btn">➡️ Next</button>
            </div>
        </div>
        <div class="canvas-container">
            <canvas id="writing-canvas" width="400" height="400"></canvas>
        </div>
        <div id="writing-feedback" class="writing-feedback"></div>
        <div class="writing-options">
            <div class="writing-language-group">
                <h3>English</h3>
                <button class="writing-mode-btn active" data-lang="en" data-mode="letters">Letters A-Z</button>
                <button class="writing-mode-btn" data-lang="en" data-mode="numbers">Numbers 0-9</button>
            </div>
        </div>
    </div>

    <!-- Arabic Writing Test Panel -->
    <div id="arabic-writing-test-panel" class="hidden container-fluid">
        <div class="writing-test-header">
            <h2 id="arabic-writing-instruction">Write the letter: ا</h2>
            <div class="writing-controls">
                <button id="arabic-prev-writing-btn" class="writing-btn">⬅️ Previous</button>
                <button id="arabic-toggle-guide-btn" class="writing-btn">👁️ Guide</button>
                <button id="arabic-clear-canvas-btn" class="writing-btn">🗑️ Clear</button>
                <button id="arabic-check-writing-btn" class="writing-btn">✅ Check</button>
                <button id="arabic-next-writing-btn" class="writing-btn">➡️ Next</button>
            </div>
        </div>
        <div class="canvas-container">
            <canvas id="arabic-writing-canvas" width="400" height="400"></canvas>
        </div>
        <div id="arabic-writing-feedback" class="writing-feedback"></div>
        <div class="writing-options">
            <div class="writing-language-group">
                <h3>Arabic</h3>
                <button class="arabic-writing-mode-btn active" data-mode="letters">Arabic Letters</button>
                <button class="arabic-writing-mode-btn" data-mode="numbers">Arabic Numbers</button>
            </div>
        </div>
    </div>

    <!-- Audio for Game -->
    <!-- IMPORTANT: You need to add a 'clap.mp3' file to your audio folder -->
    <audio id="clap-sound" src="audio/clap.mp3"></audio>
    <!-- Audio for Songs -->
    <!-- IMPORTANT: You need to add 'abc_song.mp3' and 'num_song.mp3' to your audio folder -->
    <audio id="abc-song" src="audio/abc_song.mp3" loop></audio>
    <audio id="num-song" src="audio/num_song.mp3" loop></audio>

    <script src="scripts/main.js"></script>
    <script src="scripts/arabic-main.js"></script>
    <script src="scripts/shapes-main.js"></script>
    <script src="scripts/colors-main.js"></script>
    <script src="scripts/writing-test.js"></script>
    <script src="scripts/arabic-writing-test.js"></script>
</body>
</html>
