<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/arabic-style.css">
    <script async src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
    <header>
        <h1>✍️ Arabic Writing Test ✍️</h1>
    </header>

    <nav class="main-nav" aria-label="Main navigation">
        <div class="nav-dropdown">
            <button class="nav-dropdown-btn" aria-expanded="false" aria-haspopup="true">
                🔤 English <span class="dropdown-arrow">▼</span>
            </button>
            <div class="nav-dropdown-content">
                <a href="abc.html" class="nav-dropdown-item">ABCs</a>
                <a href="numbers.html" class="nav-dropdown-item">123s</a>
            </div>
        </div>
        <div class="nav-dropdown">
            <button class="nav-dropdown-btn" aria-expanded="false" aria-haspopup="true">
                🎮 Games <span class="dropdown-arrow">▼</span>
            </button>
            <div class="nav-dropdown-content">
                <a href="alphabet-quiz.html" class="nav-dropdown-item">Alphabet Quiz</a>
                <a href="number-quiz.html" class="nav-dropdown-item">Number Quiz</a>
                <a href="color-quiz.html" class="nav-dropdown-item">Color Quiz</a>
            </div>
        </div>
        <div class="nav-dropdown">
            <button class="nav-dropdown-btn" aria-expanded="false" aria-haspopup="true">
                🔠 Arabic <span class="dropdown-arrow">▼</span>
            </button>
            <div class="nav-dropdown-content">
                <a href="arabic-abc.html" class="nav-dropdown-item">Arabic ABCs</a>
                <a href="arabic-numbers.html" class="nav-dropdown-item">Arabic 123s</a>
            </div>
        </div>
        <div class="nav-dropdown">
            <button class="nav-dropdown-btn" aria-expanded="false" aria-haspopup="true">
                🎨 Shapes & Colors <span class="dropdown-arrow">▼</span>
            </button>
            <div class="nav-dropdown-content">
                <a href="shapes.html" class="nav-dropdown-item">Shapes</a>
                <a href="colors.html" class="nav-dropdown-item">Colors</a>
            </div>
        </div>
        <div class="nav-dropdown">
            <button class="nav-dropdown-btn" aria-expanded="false" aria-haspopup="true">
                ✍️ Writing <span class="dropdown-arrow">▼</span>
            </button>
            <div class="nav-dropdown-content">
                <a href="writing-test.html" class="nav-dropdown-item">English Writing</a>
                <a href="arabic-writing-test.html" class="nav-dropdown-item">Arabic Writing</a>
            </div>
        </div>
        <a href="index.html" class="nav-home-btn" aria-label="Go to home page">🏠 Home</a>
    </nav>

    <!-- Arabic Writing Test Panel -->
    <div id="arabic-writing-test-panel" class="container-fluid" style="flex: 1;">
        <div class="writing-test-header">
            <h2 id="arabic-writing-instruction">Write the letter: ا</h2>
            <div class="writing-controls">
                <button id="arabic-prev-writing-btn" class="writing-btn">⬅️ Previous</button>
                <button id="arabic-toggle-guide-btn" class="writing-btn">👁️ Guide</button>
                <button id="arabic-clear-canvas-btn" class="writing-btn">🗑️ Clear</button>
                <button id="arabic-check-writing-btn" class="writing-btn">✅ Check</button>
                <button id="arabic-next-writing-btn" class="writing-btn">➡️ Next</button>
            </div>
        </div>
        <div class="canvas-container">
            <canvas id="arabic-writing-canvas" width="400" height="400" willreadfrequently="true"></canvas>
        </div>
        <div id="arabic-writing-feedback" class="writing-feedback"></div>
        <div class="writing-colors">
            <h3>اختر اللون:</h3>
            <div class="color-palette">
                <button class="color-btn active" data-color="black" style="background-color: black;"></button>
                <button class="color-btn" data-color="#FF5722" style="background-color: #FF5722;"></button>
                <button class="color-btn" data-color="#2196F3" style="background-color: #2196F3;"></button>
                <button class="color-btn" data-color="#4CAF50" style="background-color: #4CAF50;"></button>
                <button class="color-btn" data-color="#FF9800" style="background-color: #FF9800;"></button>
                <button class="color-btn" data-color="#9C27B0" style="background-color: #9C27B0;"></button>
                <button class="color-btn" data-color="#E91E63" style="background-color: #E91E63;"></button>
                <button class="color-btn" data-color="#00BCD4" style="background-color: #00BCD4;"></button>
            </div>
        </div>
        <div class="writing-options">
            <div class="writing-language-group">
                <h3>Arabic</h3>
                <button class="arabic-writing-mode-btn active" data-mode="letters">Arabic Letters</button>
                <button class="arabic-writing-mode-btn" data-mode="numbers">Arabic Numbers</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; <span id="current-year"></span> Fun Learning for Kids. All rights reserved.</p>
        <p>Made with ❤️ for kids everywhere</p>
    </footer>

    <script src="scripts/common.js"></script>
    <script src="scripts/arabic-writing-test-standalone.js"></script>
</body>
</html>
