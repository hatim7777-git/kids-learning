<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>123s - Fun Learning for Kids!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>🔢 Let's Learn Numbers! 🔢</h1>
    </header>

    <div class="nav-buttons">
        <a href="index.html" class="mode-btn">🏠 Home</a>
        <button id="play-num-song-btn" class="mode-btn song-btn">Play 123 Song 🎵</button>
    </div>

    <!-- Active Detail Panel -->
    <div id="details-display" class="hidden container-fluid">
        <img id="primary-image" src="" alt="Detail view">
        <div class="example-display">
            <p id="number-word-text" class="m-0"></p>
            <img id="example-image" src="" alt="Example visualization">
            <p id="example-text" class="m-0"></p>
        </div>
    </div>

    <main id="learning-main" class="container-fluid mb-4">
        <div id="num-container" class="numbers-container"></div>
    </main>

    <!-- Audio for Songs -->
    <audio id="num-song" src="audio/num_song.mp3" loop></audio>

    <script src="scripts/numbers.js"></script>
</body>
</html>
